# Render blueprint: game server (WebSocket) + web static site.
# Deploy: push repo, connect render.yaml, set env vars on the server service:
#   MAPILLARY_TOKEN, CORS_ORIGINS=https://<web-url>.onrender.com (the web
#   service is named fafoguesser, so usually https://fafoguesser.onrender.com),
#   and PROXY_TRUST=<Render load-balancer IP ranges> (REQUIRED: without it every
#   client appears as the same LB IP and they share one rate-limit bucket).
services:
  - type: web
    name: fafoserver
    rootDir: fafoserver
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAPILLARY_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PROXY_TRUST
        sync: false

  - type: web
    name: fafoguesser
    rootDir: web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
      - key: VITE_MAPTILER_KEY
        sync: false
