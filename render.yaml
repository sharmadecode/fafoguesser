# Render blueprint: game server (WebSocket) + web static site.
# Deploy: push repo, connect render.yaml, set env vars on the server service:
#   MAPILLARY_TOKEN, CORS_ORIGINS=https://<web-url>.onrender.com
services:
  - type: web
    name: fafoserver
    rootDir: fafoserver
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAPILLARY_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_PATH
        value: /var/data/leaderboard.db

  - type: web
    name: fafoweb
    rootDir: web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
      - key: VITE_MAPTILER_KEY
        sync: false
